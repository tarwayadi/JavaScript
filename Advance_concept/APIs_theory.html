<!--
   what is API?
 --API = Application Programming Interface
   An API is basically a way for two different software systems to communicate with each other.

   Think of it like a waiter in a restaurant. 
        You
        ↓
        Waiter (API)
        ↓
        Kitchen (Server)
        ↓
        Waiter (API)
        ↓
        You

    You don't go into the kitchen yourself.
    You tell the waiter what you want, and the waiter communicates with the kitchen.

        JavaScript Application
            ↓
        API
            ↓
        Server
            ↓
        Database

    Your JavaScript application can ask the server for data through an API.



-->
