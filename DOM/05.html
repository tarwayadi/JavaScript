<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chai aur code | DOM</title>

</head>
<body  style = "background-color :#212121; color:#fff">
    <ul class = "language">
        <li>javaScript</li>
    </ul>
    
</body>
<script>
    function addlanguage(langName)
    {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)
        
    }
    addlanguage("python")
    addlanguage("typeScript")

    //for this it has to traverse entire tree
    //for large scale project to work we need to use more optimised approach
    function addOptilanguage(langName)
    {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptilanguage('golang')
    // in this syntax it will not have to travel entire tree structure


    //editing value  puthon--->mojo
    const secondlang = document.querySelector("li:nth-child(2)")
    //secondlang.innerHTML = "mojo"
    const newli = document.createElement('li')
    newli.textContent = "mojo"
    secondlang.replaceWith(newli)

    //eding value javaScript--->c++
    //const thirdlang = document.querySelector("li:first-child")
    //const nli = document.createElement('li')
    //nli.textContent = "c++"
    //thirdlang.replaceWith(nli)
    const firstlang = document.querySelector("li:first-child")
    firstlang.outerHTML = '<li>c++</li>'

    //Remove
    const lastlang = document.querySelector("li:last-child")
    lastlang.remove()
</script>
</html>
